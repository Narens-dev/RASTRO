<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modo Oportunidad — RASTRO</title>
  <meta name="description" content="Licitaciones activas del Estado colombiano filtradas por sector y ubicación, con historial de ganadores anteriores — para pymes." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=24 height=24 rx=6 fill=%22%23C9A227%22/></svg>" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="rastro-nav"></div>

  <header class="page-header">
    <div class="container">
      <a href="/index.html" class="back-link">← Inicio</a>
      <h1>Modo Oportunidad</h1>
      <p class="sub">Licitaciones activas en SECOP, filtradas por sector y ubicación — nunca procesos ya cerrados. Público y sin restricción de acceso.</p>
    </div>
  </header>

  <main>
    <section class="section-tight">
      <div class="container">
        <div class="filters-bar reveal">
          <select id="filter-sector" class="select-field"></select>
          <select id="filter-location" class="select-field"></select>
          <select id="filter-value" class="select-field">
            <option value="">Cualquier valor</option>
            <option value="0-50000000">Hasta $50M</option>
            <option value="50000000-200000000">$50M – $200M</option>
            <option value="200000000-500000000">$200M – $500M</option>
            <option value="500000000-">Más de $500M</option>
          </select>
          <label style="display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text-on-light-muted); margin-left:auto;">
            <input type="checkbox" id="filter-winners" checked />
            Mostrar ganadores anteriores
          </label>
        </div>

        <p id="results-count" style="margin-top:20px; font-size:14px; color:var(--text-on-light-muted);"></p>
        <div id="opps-grid" class="opps-grid">
          <div class="state-box" style="grid-column:1/-1;"><div class="spinner"></div>Cargando licitaciones activas…</div>
        </div>
      </div>
    </section>
  </main>

  <div id="rastro-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/oportunidades.js"></script>
</body>
</html>
