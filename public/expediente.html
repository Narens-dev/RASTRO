<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expediente — RASTRO</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=24 height=24 rx=6 fill=%22%23046A38%22/></svg>" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="rastro-nav"></div>

  <header class="page-header">
    <div class="container">
      <a href="/index.html" class="back-link">← Nueva búsqueda</a>
      <div class="entity-summary">
        <div>
          <h1 id="entity-name">Cargando expediente…</h1>
          <div class="entity-meta" id="entity-chips"></div>
        </div>
        <div class="counts-row" id="counts-row"></div>
      </div>
    </div>
  </header>

  <main>
    <section class="section-tight">
      <div class="container" style="max-width: 880px;">
        <div id="ai-summary-slot"></div>
      </div>
    </section>

    <section class="section-tight" style="padding-top:0;">
      <div class="container" style="max-width: 880px;">
        <div class="section-head" style="margin-bottom:24px;">
          <span class="section-kicker">Evidencia por fuente</span>
          <h2 style="font-size:26px;">Seis fuentes, seis niveles independientes.</h2>
        </div>
        <div id="evidence-list" class="evidence-list">
          <div class="state-box"><div class="spinner"></div>Consultando fuentes oficiales…</div>
        </div>
      </div>
    </section>

    <section class="section-tight" style="padding-top:0;">
      <div class="container" style="max-width: 880px;">
        <div class="section-head" style="margin-bottom:24px;">
          <span class="section-kicker">Seguimiento (Módulo 4)</span>
          <h2 style="font-size:26px;">Historial de contratación en SECOP.</h2>
        </div>
        <div class="card" id="contracts-card">
          <div class="state-box" style="padding:40px;">Cargando…</div>
        </div>
      </div>
    </section>
  </main>

  <div id="rastro-footer"></div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/expediente.js"></script>
</body>
</html>
